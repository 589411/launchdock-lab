name: Auto Covers

on:
  workflow_dispatch:
    inputs:
      force_id:
        description: "強制重截某筆條目的 id(留空 = 只補缺)"
        required: false
        default: ""
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 號補缺一次

permissions:
  contents: write
  actions: write   # 截圖 commit 後需手動觸發 deploy(GITHUB_TOKEN push 不會觸發 push workflow)

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pyyaml playwright
          playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          if [ -n "${{ github.event.inputs.force_id }}" ]; then
            python scripts/screenshot.py --force "${{ github.event.inputs.force_id }}"
          else
            python scripts/screenshot.py
          fi
      - name: Commit new covers
        id: commit
        run: |
          git config user.name "lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/covers
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "covers: auto screenshot"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # GitHub 防遞迴:GITHUB_TOKEN 的 push 不會觸發 deploy.yml,
      # 導致線上一直是舊佔位圖。改用 workflow_dispatch 顯式觸發重建。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
